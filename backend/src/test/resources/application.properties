# Tests : base H2 en mémoire, schéma généré par Hibernate, pas de Flyway, ni e-mail ni IA
spring.datasource.url=jdbc:h2:mem:smartdept;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.mail.enabled=false
app.ai.enabled=false
app.reminders.cron=-
app.offers.sync-cron=-
app.offers.follow-up-cron=-
app.academic.risk-cron=-
app.mail.check-mx=false
# pas de cache pendant les tests : chaque test voit ses propres données
spring.cache.type=none
app.ratelimit.store=memory
app.offers.sync-on-startup=false
