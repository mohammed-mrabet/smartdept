spring.application.name=smartdept
server.port=8080

# ---------------------------------------------------------------- Base de données
# Par défaut : MySQL local (XAMPP, root sans mot de passe). Docker fournit ses propres variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartdept_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# TP5 : le schéma est géré uniquement par Flyway (db/migration).
# db/demo contient les données de démonstration (script répétable R__) : retirer ce dossier en production.
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------- Sécurité
app.jwt.secret=${JWT_SECRET:SmartDept-cle-de-developpement-a-changer-en-production-2026!}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ---------------------------------------------------------------- E-mails
# Chaque e-mail part par le SMTP réel (vraies boîtes : Gmail, Outlook, @ump.ac.ma…) si l'adresse est valide,
# sinon (adresse invalide, domaine de démonstration ou sans serveur MX, SMTP en échec) il est déposé dans Mailpit.
#   MAIL_MODE=auto (défaut) | sandbox (tout dans Mailpit) | smtp (tout en réel)
#   Gmail : SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USERNAME=vous@gmail.com SMTP_PASSWORD=<mot de passe d'application>
#   Brevo : SMTP_HOST=smtp-relay.brevo.com SMTP_PORT=587 SMTP_USERNAME=<identifiant SMTP> SMTP_PASSWORD=<clé SMTP> MAIL_FROM="SmartDept <expediteur-valide@...>"
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.mode=${MAIL_MODE:auto}
app.mail.from=${MAIL_FROM:}
app.mail.smtp.host=${SMTP_HOST:}
app.mail.smtp.port=${SMTP_PORT:587}
app.mail.smtp.username=${SMTP_USERNAME:}
app.mail.smtp.password=${SMTP_PASSWORD:}
app.mail.smtp.security=${SMTP_SECURITY:starttls}
app.mail.mailpit.host=${MAILPIT_HOST:localhost}
app.mail.mailpit.port=${MAILPIT_PORT:1025}
app.mail.mailpit.ui-url=${MAILPIT_UI_URL:http://localhost:8025}
app.mail.check-mx=${MAIL_CHECK_MX:true}

# ---------------------------------------------------------------- Cache (Redis) et limitation de débit
# CACHE_TYPE=redis avec Docker / Kubernetes ; simple (mémoire) si Redis n'est pas installé (XAMPP).
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=smartdept::
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
management.health.redis.enabled=${REDIS_HEALTH:false}
app.ratelimit.store=${RATE_LIMIT_STORE:memory}
spring.data.redis.repositories.enabled=false


# ---------------------------------------------------------------- IA (gratuite)
# Toute API compatible OpenAI : Ollama local (gratuit, sans clé), Groq ou Gemini (clé gratuite).
#   Ollama : AI_BASE_URL=http://localhost:11434/v1  AI_MODEL=llama3.2:3b
#   Groq   : AI_BASE_URL=https://api.groq.com/openai/v1  AI_MODEL=openai/gpt-oss-20b  AI_API_KEY=...
#   Gemini : AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai  AI_MODEL=gemini-2.0-flash  AI_API_KEY=...
# Sans IA (AI_ENABLED=false), un moteur local (mots-clés, résumé extractif, règles) répond à la place.
app.ai.enabled=${AI_ENABLED:false}
app.ai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama3.2:3b}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

# ---------------------------------------------------------------- Rappels automatiques (8 h chaque jour)
app.reminders.cron=${REMINDERS_CRON:0 0 8 * * *}
app.reminders.days-before=3

# ---------------------------------------------------------------- Offres de stage (API gratuites)
# Synchronisation toutes les 6 heures ; chaque API n'est utilisée que si sa clé est renseignée.
# Sans clé : Remotive, Jobicy et Arbeitnow (télétravail) fonctionnent quand même, ainsi que les offres du département.
# première synchronisation au démarrage (ignorée si une synchronisation a réussi il y a moins de 6 h)
app.offers.sync-on-startup=${OFFERS_SYNC_ON_STARTUP:true}
app.offers.sync-cron=${OFFERS_SYNC_CRON:0 15 */6 * * *}
app.offers.follow-up-cron=${OFFERS_FOLLOW_UP_CRON:0 0 9 * * *}
app.offers.retention-days=45
app.offers.results-per-query=50
app.offers.http-timeout-seconds=15
# France : France Travail (francetravail.io) et La bonne alternance (api.apprentissage.beta.gouv.fr)
app.offers.france-travail.client-id=${FRANCE_TRAVAIL_CLIENT_ID:}
app.offers.france-travail.client-secret=${FRANCE_TRAVAIL_CLIENT_SECRET:}
app.offers.lba.api-key=${LBA_API_KEY:}
app.offers.lba.search-url=${LBA_SEARCH_URL:https://api.apprentissage.beta.gouv.fr/api/job/v1/search}
# France, Belgique, Espagne, Canada : Adzuna (developer.adzuna.com)
app.offers.adzuna.app-id=${ADZUNA_APP_ID:}
app.offers.adzuna.app-key=${ADZUNA_APP_KEY:}
# Maroc + autres pays : Jooble (une clé par pays) et Careerjet / Optioncarriere
app.offers.jooble.keys=${JOOBLE_KEYS:}
app.offers.jooble.url-template=${JOOBLE_URL_TEMPLATE:https://jooble.org/api/{key}}
app.offers.careerjet.api-key=${CAREERJET_API_KEY:}
app.offers.careerjet.user-ip=${CAREERJET_USER_IP:127.0.0.1}
# Espagne : InfoJobs (developer.infojobs.net)
app.offers.infojobs.client-id=${INFOJOBS_CLIENT_ID:}
app.offers.infojobs.client-secret=${INFOJOBS_CLIENT_SECRET:}

# ---------------------------------------------------------------- Scolarité (étape 2)
app.academic.absence-threshold=3
app.academic.risk-cron=${RISK_CRON:0 30 7 * * MON}

# ---------------------------------------------------------------- Supervision (TP10)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=smartdept

# ---------------------------------------------------------------- Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
