name: CI/CD SmartDept

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend · tests et couverture
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tests unitaires et d'intégration (H2)
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Rapport JaCoCo
        uses: actions/upload-artifact@v4
        with: { name: jacoco-report, path: backend/target/site/jacoco }
      - name: Jar
        uses: actions/upload-artifact@v4
        with: { name: backend-jar, path: backend/target/smartdept-backend-*.jar }

  frontend:
    name: Frontend · tests et build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx ng build --configuration production

  docker:
    name: Images Docker · scan Trivy · Docker Hub
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: smartdept-${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smartdept-${{ matrix.component }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smartdept-${{ matrix.component }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.component }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.json
      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publication sur Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/smartdept-${{ matrix.component }}
          docker tag smartdept-${{ matrix.component }}:ci $IMAGE:latest
          docker tag smartdept-${{ matrix.component }}:ci $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}
