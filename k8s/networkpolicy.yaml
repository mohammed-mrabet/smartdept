# La base n'accepte que le backend (DevSecOps : moindre privilège réseau)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-from-backend-only
  namespace: smartdept
spec:
  podSelector:
    matchLabels: { app: mysql }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: backend }
      ports:
        - port: 3306
