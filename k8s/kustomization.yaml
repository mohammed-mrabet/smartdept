# kubectl apply -k k8s/   (après avoir créé le secret smartdept-secrets)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartdept
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql.yaml
  - mailpit.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: DOCKERHUB_USER/smartdept-backend
    newName: DOCKERHUB_USER/smartdept-backend
    newTag: latest
  - name: DOCKERHUB_USER/smartdept-frontend
    newName: DOCKERHUB_USER/smartdept-frontend
    newTag: latest
