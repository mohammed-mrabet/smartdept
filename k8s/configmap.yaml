apiVersion: v1
kind: ConfigMap
metadata:
  name: smartdept-config
  namespace: smartdept
data:
  DB_URL: "jdbc:mysql://mysql:3306/smartdept_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca"
  DB_USERNAME: "root"
  # E-mails : SMTP réel pour les vraies adresses (SMTP_USERNAME / SMTP_PASSWORD dans le secret), Mailpit sinon
  MAILPIT_HOST: "mailpit"
  MAILPIT_PORT: "1025"
  MAILPIT_UI_URL: "http://smartdept.local/mailpit"
  MAIL_MODE: "auto"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURITY: "starttls"
  # Cache Spring et limitation des tentatives dans Redis
  CACHE_TYPE: "redis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RATE_LIMIT_STORE: "redis"
  REDIS_HEALTH: "true"
  FRONTEND_URL: "http://smartdept.local"
  CORS_ORIGINS: "http://smartdept.local"
  AI_ENABLED: "false"
  AI_BASE_URL: "https://api.groq.com/openai/v1"
  AI_MODEL: "llama-3.1-8b-instant"
  # Journaux JSON (format ECS) pour Elasticsearch / Kibana
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
