# Copier en secret.yaml (ignoré par git), remplacer les valeurs, puis : kubectl apply -f k8s/secret.yaml
# ou créer le secret en ligne de commande :
#   kubectl -n smartdept create secret generic smartdept-secrets --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: smartdept-secrets
  namespace: smartdept
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  MYSQL_ROOT_PASSWORD: "change-me"
  JWT_SECRET: "remplacer-par-une-chaine-aleatoire-de-plus-de-32-caracteres"
  AI_API_KEY: ""
  ADZUNA_APP_ID: ""
  ADZUNA_APP_KEY: ""
  JOOBLE_KEYS: ""
  CAREERJET_API_KEY: ""
  FRANCE_TRAVAIL_CLIENT_ID: ""
  FRANCE_TRAVAIL_CLIENT_SECRET: ""
  LBA_API_KEY: ""
  INFOJOBS_CLIENT_ID: ""
  INFOJOBS_CLIENT_SECRET: ""
