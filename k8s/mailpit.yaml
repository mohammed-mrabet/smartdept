apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: smartdept
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: smartdept
spec:
  selector: { app: mailpit }
  ports:
    - name: smtp
      port: 1025
    - name: web
      port: 8025
