groups:
  - name: smartdept
    rules:
      - alert: BackendIndisponible
        expr: up{job="smartdept-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Le backend SmartDept ne répond plus"
          description: "Prometheus n'arrive plus à lire /actuator/prometheus depuis 1 minute."
      - alert: TauxErreurs5xx
        expr: sum(rate(http_server_requests_seconds_count{application="smartdept",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application="smartdept"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 5 % de réponses 5xx sur 5 minutes"
      - alert: LatenceElevee
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="smartdept"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95 % des requêtes dépassent 1 seconde"
      - alert: MemoireJvm
        expr: sum(jvm_memory_used_bytes{application="smartdept",area="heap"}) / sum(jvm_memory_max_bytes{application="smartdept",area="heap"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Tas JVM utilisé à plus de 85 %"
      - alert: ApiOffresEnEchec
        expr: increase(smartdept_offers_errors_total[6h]) > 3
        labels: { severity: info }
        annotations:
          summary: "L'API d'offres {{ $labels.source }} échoue de façon répétée (clé expirée ou quota atteint ?)"
