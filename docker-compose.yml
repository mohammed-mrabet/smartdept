# SmartDept : MySQL, Redis (cache), backend Spring Boot, frontend Angular (nginx) et Mailpit (e-mails de test).
# E-mails réels : renseigner SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD dans .env (voir .env.example).
#   docker compose up -d --build           -> http://localhost        (accueil public + application)
#                                            http://localhost:8025   (boîte mail Mailpit)
#   docker compose --profile ai up -d      -> ajoute Ollama (IA locale gratuite)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartdept_db
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: ${DOCKERHUB_USER:-smartdept}/smartdept-backend:latest
    depends_on:
      mysql: { condition: service_healthy }
      mailpit: { condition: service_started }
      redis: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smartdept_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-secret-must-be-long-enough-256bits}
      # E-mails : vraie adresse -> SMTP réel (Gmail, Brevo…) ; adresse de démonstration ou invalide -> Mailpit
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      MAILPIT_UI_URL: ${MAILPIT_UI_URL:-http://localhost:8025}
      MAIL_MODE: ${MAIL_MODE:-auto}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # Cache et limitation des tentatives dans Redis
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_STORE: redis
      REDIS_HEALTH: "true"
      FRONTEND_URL: http://localhost
      CORS_ORIGINS: http://localhost,http://localhost:4200
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3.2:3b}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      LBA_API_KEY: ${LBA_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JOOBLE_KEYS: ${JOOBLE_KEYS:-}
      CAREERJET_API_KEY: ${CAREERJET_API_KEY:-}
      CAREERJET_USER_IP: ${CAREERJET_USER_IP:-127.0.0.1}
      INFOJOBS_CLIENT_ID: ${INFOJOBS_CLIENT_ID:-}
      INFOJOBS_CLIENT_SECRET: ${INFOJOBS_CLIENT_SECRET:-}
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER:-smartdept}/smartdept-frontend:latest
    depends_on: [backend]
    ports: ["80:80"]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]

volumes:
  mysql-data:
  ollama-data:
