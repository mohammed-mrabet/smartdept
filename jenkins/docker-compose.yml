# Jenkins local : docker compose -f jenkins/docker-compose.yml up -d --build  →  http://localhost:8081
# Mot de passe initial : docker compose -f jenkins/docker-compose.yml exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    user: root
    ports: ["8081:8080", "50000:50000"]
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins-home:
